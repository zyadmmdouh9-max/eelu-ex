<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Auditing Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --bg2:#efe9dd; --surface:#ffffff; --surface2:#faf7f1; --line:#e4dccb; --line2:#d8cdb6;
  --ink:#16182b; --ink2:#4a4e68; --muted:#80849c;
  --brand:#2a2f8f; --brand2:#4b52d6; --accent:#f2a516; --accent2:#ffcf5a;
  --ok:#119a62; --ok-bg:#e3f6ec; --bad:#d63a4a; --bad-bg:#fde7e9;
  --s1:#4b52d6; --s2:#0e9f9a; --s4:#e08a00; --s5:#2f9e44; --sx:#c2417a;
  --shadow:0 1px 2px rgba(22,24,43,.06),0 8px 24px -12px rgba(22,24,43,.18);
  --shadow-lg:0 30px 60px -30px rgba(22,24,43,.35);
  --r:18px; --r-sm:12px;
  --grid:rgba(42,47,143,.06);
}
[data-theme="dark"]{
  --bg:#0b0d1a; --bg2:#10132a; --surface:#141833; --surface2:#191e3d; --line:#252b52; --line2:#323a6b;
  --ink:#eef0ff; --ink2:#b8bce0; --muted:#7f85b3;
  --brand:#9aa1ff; --brand2:#7c84ff; --accent:#ffbe3b; --accent2:#ffd86b;
  --ok:#37d38c; --ok-bg:rgba(55,211,140,.12); --bad:#ff6577; --bad-bg:rgba(255,101,119,.12);
  --s1:#8b91ff; --s2:#2fd3cc; --s4:#ffb02e; --s5:#5fd36f; --sx:#ff7ab3;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --shadow-lg:0 30px 70px -30px rgba(0,0,0,.8);
  --grid:rgba(154,161,255,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Plus Jakarta Sans","Cairo",system-ui,sans-serif; font-size:16px; line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px; transition:background-color .3s,color .3s;
  -webkit-font-smoothing:antialiased;
}
html[lang="ar"] body{font-family:"Cairo","Plus Jakarta Sans",system-ui,sans-serif}
.en{direction:ltr;unicode-bidi:isolate;font-family:"Plus Jakarta Sans","Cairo",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* ===== Top bar ===== */
.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:66px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:17px;white-space:nowrap}
.logo-mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;box-shadow:0 6px 16px -6px var(--brand2)}
[data-theme="dark"] .logo-mark{color:#0b0d1a}
.logo small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;line-height:1.1}
.nav{display:flex;gap:4px;margin-inline-start:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:8px 13px;border-radius:999px;font-size:14px;font-weight:700;color:var(--ink2);white-space:nowrap;transition:.2s}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--ink);color:var(--bg)}
.tools{display:flex;gap:8px}
.tbtn{height:40px;min-width:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:13px;transition:.2s;box-shadow:var(--shadow)}
.tbtn:hover{border-color:var(--brand2);transform:translateY(-1px)}
.tbtn svg{width:18px;height:18px}
@media (max-width:860px){.nav{display:none}.top .wrap{justify-content:space-between}}

/* mobile section bar */
.mnav{display:none;gap:6px;overflow-x:auto;padding:10px 20px;border-bottom:1px solid var(--line);scrollbar-width:none}
.mnav::-webkit-scrollbar{display:none}
.mnav button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;white-space:nowrap}
.mnav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:860px){.mnav{display:flex}}

/* ===== Hero ===== */
.hero{padding:56px 0 30px;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  font-size:13px;font-weight:700;color:var(--ink2)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.hero h1{font-size:clamp(34px,5.6vw,64px);line-height:1.08;margin:18px 0 14px;letter-spacing:-.03em;font-weight:800}
html[lang="ar"] .hero h1{line-height:1.3;letter-spacing:0}
.hero h1 .hl{background:linear-gradient(120deg,var(--brand2),var(--sx) 60%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:18px;color:var(--ink2);max-width:640px;margin:0}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 18px;box-shadow:var(--shadow);min-width:130px}
.stat b{display:block;font-size:26px;line-height:1.1;font-weight:800}
.stat span{font-size:13px;color:var(--muted);font-weight:600}

/* ===== Section cards (home) ===== */
.secgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding:16px 0 30px}
@media (max-width:760px){.secgrid{grid-template-columns:1fr}}
.scard{--c:var(--s1);position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;overflow:hidden;
  box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s,border-color .25s}
.scard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.scard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.scard .num{position:absolute;inset-inline-end:18px;top:6px;font-size:96px;font-weight:800;line-height:1;color:var(--c);opacity:.10;letter-spacing:-.05em}
.scard .tag{display:inline-block;font-size:12px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);padding:4px 10px;border-radius:999px}
.scard h3{font-size:23px;margin:10px 0 4px;line-height:1.3}
.scard p{margin:0 0 16px;color:var(--ink2);font-size:15px}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.topics span{font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.prog{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff));border-radius:99px;transition:width .6s}
.progtxt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;margin:8px 0 16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:13px;font-weight:800;font-size:15px;transition:.2s;border:1px solid transparent}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--c,var(--brand2));color:#fff;box-shadow:0 8px 20px -10px var(--c,var(--brand2))}
[data-theme="dark"] .btn.pri{color:#0b0d1a}
.btn.pri:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.sec{background:var(--surface2);border-color:var(--line);color:var(--ink)}
.btn.sec:hover{border-color:var(--c,var(--brand2))}
.btn.ghost{color:var(--ink2)}
.btn.ghost:hover{color:var(--ink);background:var(--surface2)}
.btn:disabled{opacity:.4;pointer-events:none}

.examcard{--c:var(--sx);background:linear-gradient(135deg,#1b1f4b,#2a2f8f 55%,#5b2a86);color:#fff;border-radius:24px;padding:30px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);margin-bottom:40px}
.examcard::after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;inset-inline-end:-90px;top:-120px;background:radial-gradient(circle,rgba(255,190,59,.55),transparent 65%)}
.examcard h3{font-size:28px;margin:0 0 6px;position:relative;z-index:1}
.examcard p{margin:0 0 18px;opacity:.85;position:relative;z-index:1;max-width:560px}
.examcard .opts{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.examcard label.lbl{display:block;font-size:12px;font-weight:800;opacity:.75;margin-bottom:6px;letter-spacing:.03em}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:9px;font-weight:800;font-size:13px;color:#fff;opacity:.8}
.seg button.on{background:#fff;color:#1b1f4b;opacity:1}
.examcard .btn.pri{background:var(--accent);color:#1b1f4b;box-shadow:0 10px 24px -10px var(--accent)}

/* ===== Page head ===== */
.phead{padding:38px 0 18px}
.crumbs{font-size:13px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center}
.crumbs button{color:var(--muted);font-weight:700}.crumbs button:hover{color:var(--ink)}
.phead h1{font-size:clamp(28px,4vw,44px);margin:10px 0 6px;line-height:1.2;letter-spacing:-.02em}
.phead p{margin:0;color:var(--ink2);font-size:17px}
.subtabs{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:20px;box-shadow:var(--shadow)}
.subtabs button{padding:9px 18px;border-radius:10px;font-weight:800;font-size:14px;color:var(--ink2);display:inline-flex;align-items:center;gap:8px}
.subtabs button.on{background:var(--c);color:#fff}
[data-theme="dark"] .subtabs button.on{color:#0b0d1a}
.subtabs svg{width:16px;height:16px}

/* ===== Lesson ===== */
.lesson{padding:10px 0 60px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;margin-bottom:18px;box-shadow:var(--shadow)}
.blk>h2{display:flex;align-items:center;gap:12px;margin:0 0 6px;font-size:22px;line-height:1.35}
.blk>h2 .n{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;font-weight:800;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.blk>.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.blk p{margin:0 0 12px}
.term{font-weight:800;color:var(--c);direction:ltr;unicode-bidi:isolate}
.k{font-weight:800}
.g2,.g3,.g4{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:860px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.tile{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative}
.tile .ic{font-size:22px;line-height:1;margin-bottom:8px}
.tile h4{margin:0 0 4px;font-size:16px;line-height:1.35}
.tile h4 .en{color:var(--c)}
.tile p{margin:0;font-size:14px;color:var(--ink2);line-height:1.6}
.tile.hl{border-color:color-mix(in srgb,var(--c) 40%,var(--line));background:color-mix(in srgb,var(--c) 7%,var(--surface2))}
.vsbox{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
@media (max-width:700px){.vsbox{grid-template-columns:1fr}.vsbox .vs{justify-self:center}}
.vsbox .vs{align-self:center;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--ink);color:var(--bg);font-size:14px}
.side{border-radius:18px;padding:20px;border:1.5px solid}
.side.a{border-color:color-mix(in srgb,var(--s1) 40%,transparent);background:color-mix(in srgb,var(--s1) 7%,transparent)}
.side.b{border-color:color-mix(in srgb,var(--sx) 40%,transparent);background:color-mix(in srgb,var(--sx) 7%,transparent)}
.side h3{margin:0;font-size:20px}
.side .q{font-size:15px;font-weight:800;margin:4px 0 12px;opacity:.9}
.side.a h3,.side.a .q{color:var(--s1)}.side.b h3,.side.b .q{color:var(--sx)}
ul.ck{list-style:none;padding:0;margin:0}
ul.ck li{position:relative;padding-inline-start:26px;margin:6px 0;font-size:15px}
ul.ck li::before{content:"";position:absolute;inset-inline-start:0;top:.55em;width:14px;height:14px;border-radius:5px;background:var(--c);opacity:.85;
  -webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>') center/contain no-repeat;
  mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>') center/contain no-repeat}
.side.a ul.ck li::before{background:var(--s1)}.side.b ul.ck li::before{background:var(--sx)}
.call{display:flex;gap:12px;padding:14px 16px;border-radius:14px;margin-top:14px;font-size:15px;border:1px dashed}
.call .ci{font-size:20px;line-height:1.3;flex:none}
.call.tip{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.call.warn{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.call.mem{background:color-mix(in srgb,var(--brand2) 9%,transparent);border-color:color-mix(in srgb,var(--brand2) 45%,transparent)}
.call b{font-weight:800}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;counter-reset:s}
@media (max-width:860px){.steps{grid-template-columns:repeat(2,1fr)}}
.step{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:13px;margin-bottom:8px}
[data-theme="dark"] .step::before{color:#0b0d1a}
.step b{display:block;font-size:14px;line-height:1.35}
.step b .en{color:var(--c)}
.step span{display:block;font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.5}
.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.flow .fx{flex:1;min-width:140px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.flow .fx b{display:block}
.flow .fx small{color:var(--ink2);font-size:13px}
.flow .ar{align-self:center;color:var(--muted);font-weight:800}
html[dir="rtl"] .flow .ar{transform:scaleX(-1)}
table.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
table.cmp th,table.cmp td{padding:12px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
table.cmp tr:last-child td{border-bottom:0}
table.cmp thead th{background:var(--surface2);font-size:14px}
table.cmp td:first-child{font-weight:800;white-space:nowrap;color:var(--ink2)}
table.cmp .fs{color:var(--s1)}table.cmp .bp{color:var(--sx)}
.tblwrap{overflow-x:auto}
.mnemo{display:flex;gap:8px;flex-wrap:wrap;direction:ltr;justify-content:center;margin:6px 0 4px}
.mnemo span{display:grid;place-items:center;min-width:54px;height:54px;padding:0 10px;border-radius:14px;background:var(--c);color:#fff;font-weight:800;font-size:24px;box-shadow:0 8px 18px -10px var(--c)}
[data-theme="dark"] .mnemo span{color:#0b0d1a}
.mnemo span small{font-size:10px;font-weight:700;display:block;line-height:1;margin-top:-6px;opacity:.9}
.lights .tile{border-width:2px}
.light-w{--c:#9aa3b5}.light-g{--c:#e0a100}.light-b{--c:#d63a4a}
.lights .tile h4{color:var(--c)}
.recap{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,var(--surface)),var(--surface));border:1.5px solid color-mix(in srgb,var(--c) 35%,var(--line))}
.recap ol{margin:0;padding-inline-start:20px}
.recap li{margin:6px 0}
.cta{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:22px 26px;border-radius:22px;background:var(--ink);color:var(--bg);margin-top:10px}
.cta h3{margin:0;font-size:20px}
.cta p{margin:2px 0 0;opacity:.75;font-size:14px}
.cta .btn.pri{background:var(--accent);color:#16182b}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
@media (max-width:640px){.money{grid-template-columns:1fr}}
.money div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.money b{display:block;font-size:20px;color:var(--c);direction:ltr}
.money small{color:var(--muted);font-weight:700;font-size:12px}

/* ===== Quiz ===== */
.qz{display:grid;grid-template-columns:1fr 290px;gap:18px;padding:6px 0 60px;align-items:start}
@media (max-width:960px){.qz{grid-template-columns:1fr}}
.qbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.filters{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.filters button{padding:7px 12px;border-radius:9px;font-weight:800;font-size:13px;color:var(--ink2)}
.filters button.on{background:var(--ink);color:var(--bg)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.qcard .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.qno{font-weight:800;font-size:14px;color:var(--muted)}
.qno b{color:var(--ink);font-size:18px}
.badge{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c)}
.badge.gray{background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.qtext{font-size:21px;font-weight:700;line-height:1.55;margin:0 0 22px;direction:ltr;text-align:left;font-family:"Plus Jakarta Sans","Cairo",sans-serif}
.opts2{display:grid;gap:10px}
.opts2.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;border-radius:15px;border:1.5px solid var(--line);background:var(--surface2);
  text-align:left;direction:ltr;font-size:16px;font-weight:600;transition:transform .15s,border-color .2s,background .2s;font-family:"Plus Jakarta Sans","Cairo",sans-serif}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateY(-1px)}
.opt .L{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.opt .tx{flex:1}
.opt .ar-t{font-family:"Cairo",sans-serif;font-size:13px;color:var(--muted);font-weight:700;margin-inline-start:6px}
.opts2.tf .opt{justify-content:center;padding:20px;font-size:18px;font-weight:800}
.opts2.tf .opt .L{display:none}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .L{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .4s}
.opt.bad .L{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.5}
.opt .mk{flex:none;font-weight:800;font-size:18px}

.fb{margin-top:18px;border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}

.fb.ok .ico{background:var(--ok)}.fb.bad .ico{background:var(--bad)}
.fb h4{margin:0 0 2px;font-size:17px}
.fb.ok h4{color:var(--ok)}.fb.bad h4{color:var(--bad)}
.fb p{margin:0;font-size:15px;color:var(--ink)}
.fb .right{direction:ltr;unicode-bidi:isolate;font-weight:800}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px}
.kbd{font-size:12px;color:var(--muted);font-weight:600}
.kbd kbd{font-family:inherit;font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;border:1px solid var(--line2);background:var(--surface2);margin:0 2px}
@media (max-width:640px){.kbd{display:none}.qcard{padding:20px}.qtext{font-size:18px}}
.side-p{position:sticky;top:84px;display:grid;gap:14px}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.pbox h4{margin:0 0 12px;font-size:14px;color:var(--ink2);display:flex;justify-content:space-between}
.score3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.score3 div{border-radius:12px;padding:8px 4px;background:var(--surface2);border:1px solid var(--line)}
.score3 b{display:block;font-size:22px;line-height:1.2}
.score3 small{font-size:11px;font-weight:800;color:var(--muted)}
.score3 .o b{color:var(--ok)}.score3 .x b{color:var(--bad)}
.dots{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:300px;overflow:auto;padding:2px}
.dot{aspect-ratio:1;border-radius:9px;font-size:12px;font-weight:800;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);transition:.15s}
.dot:hover{border-color:var(--c)}
.dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.dot.cur{outline:2.5px solid var(--c);outline-offset:2px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);font-weight:700;margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;color:var(--ink2);padding:6px 0}
.sw{width:42px;height:24px;border-radius:99px;background:var(--line2);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--c)}
.sw.on::after{inset-inline-start:21px}
.topprog{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.topprog i{display:block;height:100%;background:var(--c);transition:width .4s}

/* result */
.result{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:34px;box-shadow:var(--shadow-lg);text-align:center}
.ring{width:190px;height:190px;margin:0 auto 18px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .v b{font-size:46px;line-height:1;font-weight:800}
.ring .v small{color:var(--muted);font-weight:700;font-size:13px}
.result h2{margin:0 0 4px;font-size:28px}
.result p{color:var(--ink2);margin:0 0 20px}
.result .row{justify-content:center}
.review{margin-top:26px;text-align:start}
.review h3{font-size:18px;margin:0 0 10px}
.rv{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:var(--surface2)}
.rv .qq{direction:ltr;text-align:left;font-weight:700;margin-bottom:6px}
.rv .aa{font-size:14px;direction:ltr;text-align:left}
.rv .aa .y{color:var(--bad);font-weight:800}.rv .aa .c{color:var(--ok);font-weight:800}
.rv .ee{font-size:14px;color:var(--ink2);margin-top:6px}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.confetti i{position:absolute;width:9px;height:14px;top:-20px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;z-index:90;animation:pop .3s}

footer{padding:30px 0 40px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:20px}
.fade{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

ul.ck.no li::before{background:var(--bad);-webkit-mask:none;mask:none;content:"✕";color:var(--bad);background:none;font-size:13px;font-weight:800;top:.1em;width:auto;height:auto}


.formula{direction:ltr;unicode-bidi:isolate;text-align:center;font-family:"Plus Jakarta Sans","Cairo",sans-serif;font-weight:800;font-size:clamp(17px,2.4vw,22px);padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--c) 9%,var(--surface2));border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));color:var(--ink);margin:12px 0}

.calc .ans{color:var(--c);font-weight:800}

.es summary::-webkit-details-marker{display:none}
.es summary::after{content:"+";margin-inline-start:auto;font-size:24px;color:var(--muted)}
.es[open] summary::after{content:"\2212"}
.es .qn{flex:none;padding:6px 12px;border-radius:10px;background:var(--accent);color:#16182b;font-weight:800}
.es .bd{padding:0 22px 22px}
.es table.cmp td ol{margin:0;padding-inline-start:20px}
.es table.cmp td:last-child{direction:ltr;text-align:left}
.ecard{--c:var(--sx);border-style:dashed;border-width:2px;margin-bottom:18px}

</style>

const SECTIONS=[
{id:'s2',n:'02',c:'var(--s1)',title:{ar:'أساسيات المراجعة وأنواعها',en:'Auditing Basics & Types'},
 desc:{ar:'يعني إيه Auditing، الفرق بين Assurance وAttest، أنواع المراجعة، أنواع المراجعين، والـ CPA.',en:'What auditing is, assurance vs attest, types of audits and auditors, and the CPA.'},
 topics:['Definition','Assurance','4 Audit Types','Auditors','CPA'],
 lesson:(L)=>`
 <div class="blk"><h2><span class="n">1</span>${L('يعني إيه Auditing؟','What is auditing?')}</h2>
  <div class="flow"><div class="fx"><b>🏢 ${L('الإدارة','Management')}</b><small>${L('بتجهز القوائم وهي المسؤولة عنها','Prepares the statements')}</small></div><div class="ar">→</div><div class="fx"><b>🔍 ${L('المراجع','Auditor')}</b><small>${L('بيجمع أدلة ويقيّمها','Collects & evaluates evidence')}</small></div><div class="ar">→</div><div class="fx"><b>📝 ${L('رأي','Opinion')}</b><small>${L('بيقول القوائم عادلة ولا لأ','Fair or not')}</small></div></div>
  <div class="call mem"><span class="ci">🧠</span><div>${L('<b>Auditing</b> = تجميع وتقييم الأدلة عن معلومات مقارنةً بمعايير محددة. والمسؤول الأول عن عدالة القوائم هو <b>إدارة العميل</b> مش المراجع.','<b>Auditing</b> = accumulating & evaluating evidence about information against established criteria. <b>Client management</b> is responsible for the statements.')}</div></div></div>
 <div class="blk"><h2><span class="n">2</span>Assurance · Attest · Auditing</h2>
  <div class="flow"><div class="fx"><b>Assurance</b><small>${L('الأوسع','Broadest')}</small></div><div class="ar">⊃</div><div class="fx"><b>Attest</b><small>${L('جزء من Assurance','Subset')}</small></div><div class="ar">⊃</div><div class="fx"><b>Auditing</b><small>${L('نوع من Attest','A type of attest')}</small></div></div>
  <div class="call tip"><span class="ci">💡</span><div>${L('<b>Attestation</b> = الـ CPA بيقرر مدى الاعتماد على ادعاء (assertion) صادر من طرف تاني.','<b>Attestation</b>: the CPA reports on the reliability of another party’s assertion.')}</div></div></div>
 <div class="blk"><h2><span class="n">3</span>${L('أنواع المراجعة الـ 4','The 4 types of audit')}</h2>
  <div class="g2"><div class="tile hl"><div class="ic">📊</div><h4>${B('Financial statement audit')}</h4><p>${L('عدالة الميزانية وقائمة الدخل والتدفقات النقدية.','Fair presentation of balance sheet, income & cash flows.')}</p></div>
  <div class="tile"><div class="ic">📜</div><h4>${B('Compliance audit')}</h4><p>${L('الالتزام بقوانين ولوائح، زي مراجعة <b>الإقرار الضريبي</b>.','Laws & rules, e.g. auditing a <b>tax return</b>.')}</p></div>
  <div class="tile"><div class="ic">⚙️</div><h4>${B('Operational audit')}</h4><p>${L('<b>كفاءة وفعالية</b> استخدام الموارد، زي قسم الكمبيوتر.','<b>Efficiency & effectiveness</b>, e.g. the computer department.')}</p></div>
  <div class="tile"><div class="ic">🕵️</div><h4>${B('Forensic audit')}</h4><p>${L('فحص السجلات لاكتشاف <b>الفساد أو الغش</b>.','Records examined for <b>corruption or fraud</b>.')}</p></div></div></div>
 <div class="blk"><h2><span class="n">4</span>${L('أنواع المراجعين','Types of auditors')}</h2>
  <div class="g4"><div class="tile"><h4>${B('External')}</h4><p>${L('مكاتب CPA، مستقلين، بيراجعوا القوائم التاريخية المنشورة.','CPA firms; independent; published historical statements.')}</p></div>
  <div class="tile"><h4>${B('Internal')}</h4><p>${L('موظفين عند الشركة. عيبهم: <b>قلة الاستقلال</b>.','Employees; main weakness: <b>lack of independence</b>.')}</p></div>
  <div class="tile"><h4>${B('Government')}</h4><p>${L('زي <b>GAO</b> بيراجع للكونجرس.','e.g. <b>GAO</b>, audits for Congress.')}</p></div>
  <div class="tile"><h4>${B('Forensic')}</h4><p>${L('متخصص في الغش والاختلاس وغسيل الأموال.','Fraud, embezzlement, money laundering.')}</p></div></div></div>
 <div class="blk"><h2><span class="n">5</span>CPA & Big Four</h2>
  <div class="mnemo"><span>Deloitte</span><span>PwC</span><span>EY</span><span>KPMG</span></div>
  <div class="call warn"><span class="ci">🚫</span><div>${L('<b>Grant Thornton</b> مش من الـ Big Four.','<b>Grant Thornton</b> is NOT a Big Four firm.')}</div></div>
  <div class="g3" style="margin-top:12px"><div class="tile hl"><h4>3 Es</h4><p>Education · Examination · Experience</p></div><div class="tile"><h4>CPA</h4><p>Certified Public Accountant</p></div><div class="tile"><h4>${L('الامتحان','The exam')}</h4><p>${L('بيجهزه AICPA، كمبيوتر عند الطلب. في مصر: الخبرة 3 سنين كحد أدنى تحت مشرف مسجل في وزارة المالية.','Prepared by AICPA, computerized. Egypt: min. 3 years supervised by a Ministry of Finance-registered accountant.')}</p></div></div></div>`},
{id:'s3',n:'03',c:'var(--s2)',title:{ar:'معايير المراجعة والجهات المنظمة',en:'Auditing Standards & Bodies'},
 desc:{ar:'ليه المعايير مهمة، PCAOB وSOX، AICPA وIAASB، والاختصارات.',en:'Why standards matter, PCAOB & SOX, AICPA and IAASB, and the acronyms.'},
 topics:['Importance','PCAOB','SOX 2002','AICPA','IAASB'],
 lesson:(L)=>`
 <div class="blk"><h2><span class="n">1</span>${L('ليه المعايير مهمة؟','Why standards matter')}</h2>
  <p>${L('معايير المراجعة هي <b>الدليل ومقياس جودة أداء المراجع</b>:','Standards are the <b>guideline and measure of the auditor’s quality</b>:')}</p>
  <div class="g3"><div class="tile"><div class="ic">✅</div><h4>${L('جودة واتساق','Quality & consistency')}</h4></div><div class="tile"><div class="ic">🤝</div><h4>${L('مصداقية وثقة','Credibility & trust')}</h4></div><div class="tile"><div class="ic">🚨</div><h4>${L('تقييم مخاطر وكشف غش','Risk assessment & fraud')}</h4></div><div class="tile"><div class="ic">⚖️</div><h4>${L('أخلاقيات واستقلال','Ethics & independence')}</h4></div><div class="tile"><div class="ic">📑</div><h4>${L('التزام قانوني','Legal compliance')}</h4></div></div>
  <div class="call warn"><span class="ci">🚫</span><div>${L('<b>مش</b> من المعايير: الميزانيات السنوية، التوظيف، أو حساب ضريبة موظفي العميل.','NOT standards’ role: budgets, hiring, employees’ tax liability.')}</div></div></div>
 <div class="blk"><h2><span class="n">2</span>${L('3 جهات لازم تفرق بينهم','3 bodies to tell apart')}</h2>

/* ================= helpers ================= */
function secProgress(id){
  const qs=QUESTIONS[id];let a=0,c=0;
  qs.forEach(q=>{if(q.id in S.stats){a++;if(S.stats[q.id]===1)c++}});
  return {total:qs.length,a,c};
}
function saveStats(){store.set('stats',S.stats)}
function go(view){S.view=view;render();window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'})}

/* ================= session ================= */
function makeSession(key,title,ids,c,meta={}){
  const list=S.shuffleQ||meta.random?shuffle(ids):ids.slice();
  const orders={};
  list.forEach(id=>{const q=ALLQ[id];orders[id]=q.t==='mc'?(S.shuffleO?shuffle(q.o.map((_,i)=>i)):q.o.map((_,i)=>i)):[0,1]});
  S.sess={key,title,ids:list,all:ids,orders,ans:{},idx:0,c,filter:'all',done:false,...meta};
}
function sessView(){
  const s=S.sess; if(!s) return [];
  if(s.filter==='all') return s.ids;
  return s.ids.filter(id=>ALLQ[id].t===s.filter);
}
function startSectionQuiz(id,filter='all'){
  const sec=secById(id);
  makeSession(id,sec.title,QUESTIONS[id].map(q=>q.id),sec.c);
  S.sess.filter=filter;
  go({name:'sec',id,tab:'quiz'});
}
function startExam(){
  const pool=[],seen=new Set();shuffle(S.exam.secs.flatMap(id=>QUESTIONS[id])).forEach(q=>{const k=q.g||q.id;if(!seen.has(k)){seen.add(k);pool.push(q.id)}});
  if(!pool.length) return;
  const n=S.exam.count==='all'?pool.length:Math.min(S.exam.count,pool.length);
  const ids=shuffle(pool).slice(0,n);
  makeSession('exam',{ar:'الامتحان الشامل',en:'Full Exam'},ids,'var(--sx)',{exam:true});
  S.sess.ids=ids; // already random
  go({name:'exam'});
}

     ${s.exam?'':`<div class="toggle" data-act="tq"><span>${t('shuffleQ')}</span><span class="sw ${S.shuffleQ?'on':''}"></span></div>`}
     <div class="toggle" data-act="to"><span>${t('shuffleO')}</span><span class="sw ${S.shuffleO?'on':''}"></span></div>
     <button class="btn sec" style="width:100%;margin-top:8px" data-act="reset">↺ ${t('reset')}</button>
    </div>
   </aside></div>`;
}

function renderResult(){
  const s=S.sess;const list=sessView();
  const c=list.filter(x=>s.ans[x]===ALLQ[x].a).length;const tot=list.length;const pct=tot?Math.round(c/tot*100):0;
  const lvl=pct<50?0:pct<75?1:pct<90?2:3;
  const R=80,C=2*Math.PI*R;
  const col=pct<50?'var(--bad)':pct<75?'var(--accent)':'var(--ok)';
  const wrong=list.filter(x=>s.ans[x]!==undefined&&s.ans[x]!==ALLQ[x].a);
  const fmt=q=>i=>q.t==='tf'?(i===0?'True':'False'):q.o[i];
  const rv=wrong.map(x=>{const q=ALLQ[x];const f=fmt(q);return `<div class="rv"><div class="qq">${esc(q.q)}</div>
    <div class="aa"><span>${t('yourAns')}</span> <span class="y">${esc(f(s.ans[x]))}</span> · <span>${t('corrAns')}</span> <span class="c">${esc(f(q.a))}</span></div>
    <div class="ee">💡 ${esc(q.ex[S.lang])}</div></div>`}).join('');
  return `<div class="result fade" style="margin-bottom:60px">
   <div class="ring"><svg width="190" height="190"><circle cx="95" cy="95" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="16"/>
    <circle cx="95" cy="95" r="${R}" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" id="ringc" data-off="${C*(1-pct/100)}" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)"/></svg>
    <div class="v"><b>${pct}%</b><small>${c} / ${tot}</small></div></div>
   <h2>${t('resTitle')[lvl]}</h2><p>${t('resSub').replace('{c}',c).replace('{t}',tot)}</p>
   <div class="row">
    ${wrong.length?`<button class="btn pri" data-act="retry-wrong">${t('retryWrong')} (${wrong.length})</button>`:''}
    <button class="btn sec" data-act="retry-all">${t('retryAll')}</button>
    ${s.exam?`<button class="btn ghost" data-go="home">${t('goHome')}</button>`:`<button class="btn ghost" data-go="sec" data-id="${s.key}" data-tab="lesson">${t('backLesson')}</button>`}
   </div>
   ${wrong.length?`<div class="review"><h3>${t('reviewWrong')}</h3>${rv}</div>`:''}
  </div>`;
}

function renderEssayCard(){return `<article class="scard ecard fade"><div class="num">✍️</div><span class="tag">${L('مقالي','Essay')}</span><h3>${L('أسئلة المقالي (Essay)','Essay questions')}</h3><p>${L('مستقلة عن السكاشن: تعريف PCAOB وAICPA وIAASB ووظايفهم، وكمان الـ GAAS. حاول تجاوب في دماغك وبعدين اظهر الإجابة.','Separate from the sections: PCAOB, AICPA, IAASB and GAAS. Try answering first, then reveal.')}</p><div class="row"><button class="btn pri" data-go="essay">${I.pen}${L('افتح المقالي','Open essay')} · ${ESSAYS.length}</button></div></article>`}
function renderEssay(){
 const items=ESSAYS.map((x,i)=>`<details class="es"><summary><span class="qn">Q${i+1}</span><span>${esc(x.q)}</span></summary><div class="bd"><div class="tblwrap"><table class="cmp"><tbody>${x.rows.map(r=>`<tr><td>${L(r[0],r[1])}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div><div class="call mem"><span class="ci">🧠</span><div>${L(x.g[0],x.g[1])}</div></div></div></details>`).join('');
 return `<main class="wrap" style="--c:var(--sx)"><div class="phead fade"><div class="crumbs"><button data-go="home">${t('home')}</button><span>›</span><span>${L('مقالي','Essay')}</span></div><h1>✍️ ${L('مقالي (Essay)','Essay questions')}</h1><p>${L('دوس على السؤال عشان تشوف الإجابة النموذجية.','Tap a question to reveal the model answer.')}</p></div><div class="lesson fade">${items}</div></main>`}
/* ================= main render ================= */
function render(){
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  document.documentElement.dataset.theme=S.theme;
  document.title=t('brand');
  const v=S.view;let main='';
  if(v.name==='home') main=renderHome();
  else if(v.name==='sec') main=renderSection();
  else if(v.name==='exam') main=renderExamPage();
  else if(v.name==='essay') main=renderEssay();
  document.getElementById('app').innerHTML=renderTop()+main+`<footer>${t('footer')}</footer>`;
  const ring=document.getElementById('ringc');
  if(ring) requestAnimationFrame(()=>requestAnimationFrame(()=>ring.style.strokeDashoffset=ring.dataset.off));
}
function rerenderQuiz(scrollCard){render();if(scrollCard){const c=document.getElementById('qcard');if(c){const r=c.getBoundingClientRect();if(r.top<70||r.top>window.innerHeight*.5)window.scrollTo({top:window.scrollY+r.top-90,behavior:'smooth'})}}}

/* ================= actions ================= */
function answer(i){
  const s=S.sess;if(!s||s.done)return;const list=sessView();const id=list[s.idx];if(s.ans[id]!==undefined)return;
  s.ans[id]=i;const ok=i===ALLQ[id].a;S.stats[id]=ok?1:0;saveStats();
  render();
  if(ok) burst(14);
}
function finish(){
  const s=S.sess;const list=sessView();const left=list.filter(x=>s.ans[x]===undefined).length;
  if(left&&!confirm(t('notAnswered').replace('{n}',left)))return;
  s.done=true;render();window.scrollTo({top:0,behavior:'smooth'});
  const c=list.filter(x=>s.ans[x]===ALLQ[x].a).length;if(list.length&&c/list.length>=.75)burst(80);
}
function burst(n){
  const box=document.createElement('div');box.className='confetti';const cols=['#4b52d6','#ffbe3b','#2fd3cc','#ff7ab3','#37d38c'];
  for(let i=0;i<n;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'vw';e.style.background=cols[i%cols.length];
    e.style.animationDuration=(1.4+Math.random()*1.6)+'s';e.style.animationDelay=Math.random()*.3+'s';e.style.transform=`rotate(${Math.random()*360}deg)`;box.appendChild(e)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),3500);
}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-go],[data-act]');if(!b)return;
  if(b.dataset.go){const v={name:b.dataset.go};if(b.dataset.id)v.id=b.dataset.id;v.tab=b.dataset.tab||'lesson';go(v);return}
  const a=b.dataset.act;const s=S.sess;
  switch(a){
    case 'lang':S.lang=S.lang==='ar'?'en':'ar';store.set('lang',S.lang);render();break;
    case 'theme':S.theme=S.theme==='dark'?'light':'dark';store.set('theme',S.theme);render();break;
    case 'quiz':startSectionQuiz(b.dataset.id);break;
    case 'exam-home':go({name:'exam'});break;
    case 'exsec':{const id=b.dataset.id;const i=S.exam.secs.indexOf(id);i>=0?S.exam.secs.splice(i,1):S.exam.secs.push(id);render();break}
    case 'excount':S.exam.count=b.dataset.v==='all'?'all':+b.dataset.v;render();break;
    case 'exam':startExam();break;
    case 'ans':answer(+b.dataset.i);break;
    case 'next':s.idx=Math.min(s.idx+1,sessView().length-1);rerenderQuiz(true);break;
    case 'prev':s.idx=Math.max(s.idx-1,0);rerenderQuiz(true);break;
    case 'jump':s.idx=+b.dataset.i;rerenderQuiz(true);break;
    case 'finish':finish();break;
    case 'filter':s.filter=b.dataset.f;s.idx=0;render();break;
    case 'tq':S.shuffleQ=!S.shuffleQ;store.set('shuffleQ',S.shuffleQ);{const f=s.filter;makeSession(s.key,s.title,s.all,s.c);S.sess.filter=f}render();break;
    case 'to':S.shuffleO=!S.shuffleO;store.set('shuffleO',S.shuffleO);Object.keys(s.orders).forEach(id=>{const q=ALLQ[id];if(q.t==='mc'&&s.ans[id]===undefined)s.orders[id]=S.shuffleO?shuffle(q.o.map((_,i)=>i)):q.o.map((_,i)=>i)});render();break;
    case 'reset':{const f=s.filter;if(s.exam){startExam()}else{makeSession(s.key,s.title,s.all,s.c);S.sess.filter=f;render()}toast(t('resetDone'));break}
    case 'retry-all':{const f=s.filter;if(s.exam){const ids=shuffle(s.ids);makeSession('exam',s.title,ids,s.c,{exam:true,random:true})}else{makeSession(s.key,s.title,s.all,s.c);S.sess.filter=f}render();window.scrollTo({top:0});break}
    case 'retry-wrong':{const list=sessView();const w=list.filter(x=>s.ans[x]!==undefined&&s.ans[x]!==ALLQ[x].a);
      makeSession(s.key,s.title,w,s.c,{exam:s.exam});S.sess.filter='all';render();window.scrollTo({top:0});break}
  }
});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const s=S.sess;if(!s||s.done)return;if(!document.getElementById('qcard'))return;
  const list=sessView();const id=list[s.idx];const q=ALLQ[id];const k=e.key.toLowerCase();
  if(q.t==='tf'){if(k==='t'||k==='1'){answer(0);return}if(k==='f'||k==='2'){answer(1);return}}
  else{const m={a:0,b:1,c:2,d:3,e:4,'1':0,'2':1,'3':2,'4':3,'5':4}[k];if(m!==undefined&&m<q.o.length){answer(s.orders[id][m]);return}}
  if(k==='enter'){e.preventDefault();if(s.idx===list.length-1){if(s.ans[id]!==undefined)finish()}else{s.idx++;rerenderQuiz(true)}}
  const nextKey=S.lang==='ar'?'arrowleft':'arrowright',prevKey=S.lang==='ar'?'arrowright':'arrowleft';
  if(k===nextKey&&s.idx<list.length-1){s.idx++;rerenderQuiz(true)}
  if(k===prevKey&&s.idx>0){s.idx--;rerenderQuiz(true)}
});
render();

</script>
</body>
</html>
